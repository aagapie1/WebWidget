name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real Redis for the feedback store test (ADR 005).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      # Real Postgres for the admin storage tests (ADR 008).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: dev-postgres-superuser
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      # Same roles and databases as the dev compose (services cannot mount init scripts).
      - run: psql -v ON_ERROR_STOP=1 -h localhost -p 55432 -U postgres -f deploy/postgres/init/01-roles.sql
        env:
          PGPASSWORD: dev-postgres-superuser
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # pnpm comes from corepack in the next step, the automatic cache would need it earlier.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm config:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          REDIS_URL: redis://localhost:6379
          TEST_DATABASE_URL: postgres://widget_app:dev-widget-app@localhost:55432/widget_test
          TEST_DATABASE_OWNER_URL: postgres://widget_owner:dev-widget-owner@localhost:55432/widget_test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    # Admin interface e2e (E4b.1): Postgres and Redis here, Keycloak started after the checkout
    # (it imports the test realms from the repository). Test credentials only.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: dev-postgres-superuser
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Start Keycloak with the test realms
        run: >-
          docker run -d --name keycloak -p 8081:8080
          -v "$GITHUB_WORKSPACE/deploy/keycloak:/opt/keycloak/data/import:ro"
          -v "$GITHUB_WORKSPACE/deploy/keycloak-themes:/opt/keycloak/themes:ro"
          -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=dev-keycloak-admin
          -e KC_HOSTNAME=http://localhost:8081 -e KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
          quay.io/keycloak/keycloak:26.3 start-dev --import-realm
      - run: psql -v ON_ERROR_STOP=1 -h localhost -p 55432 -U postgres -f deploy/postgres/init/01-roles.sql
        env:
          PGPASSWORD: dev-postgres-superuser
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # pnpm comes from corepack in the next step, the automatic cache would need it earlier.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter e2e exec playwright install --with-deps ${{ matrix.browser }}
      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:8081/realms/pilot/.well-known/openid-configuration && exit 0
            sleep 2
          done
          docker logs keycloak | tail -50
          exit 1
      # Fake Dify only: no secrets, no access to real Dify instances.
      - run: pnpm --filter e2e exec playwright test --project ${{ matrix.browser }}
        env:
          E2E_ALL_BROWSERS: '1'
          E2E_ADMIN: '1'
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: e2e/test-results/
          retention-days: 7
