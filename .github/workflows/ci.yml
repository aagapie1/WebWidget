name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real Redis for the feedback store test (ADR 005).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # pnpm comes from corepack in the next step, the automatic cache would need it earlier.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm config:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          REDIS_URL: redis://localhost:6379
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # pnpm comes from corepack in the next step, the automatic cache would need it earlier.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter e2e exec playwright install --with-deps ${{ matrix.browser }}
      # Fake Dify only: no secrets, no access to real Dify instances.
      - run: pnpm --filter e2e exec playwright test --project ${{ matrix.browser }}
        env:
          E2E_ALL_BROWSERS: '1'
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: e2e/test-results/
          retention-days: 7
