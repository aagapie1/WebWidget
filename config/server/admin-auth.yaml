# Admin interface authentication (ADR 008, spec §4). SERVER configuration: not editable from the
# admin interface and not part of any tenant configuration.
# The tenant of an admin comes only from the issuer (`iss`) of their token: issuer → tenant.
# Client secrets are never written here: `clientSecretEnv` names the environment variable.
tenants:
  - tenant: pilot
    issuer: http://localhost:8081/realms/pilot
    clientId: widget-admin-ui
    clientSecretEnv: ADMIN_OIDC_SECRET_PILOT
  - tenant: demo-primarie
    issuer: http://localhost:8081/realms/demo-primarie
    clientId: widget-admin-ui
    clientSecretEnv: ADMIN_OIDC_SECRET_DEMO_PRIMARIE
# Platform operators (super-admin): every tenant.
platform:
  issuer: http://localhost:8081/realms/platform
  clientId: widget-admin-ui
  clientSecretEnv: ADMIN_OIDC_SECRET_PLATFORM
